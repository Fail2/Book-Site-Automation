name: Playwright Tests and Reports

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Prepare test result folders
        run: |
          mkdir -p allure-results
          mkdir -p playwright-artifacts
          rm -rf allure-report

      - name: Run tests and generate results
        id: tests
        continue-on-error: true
        run: |
          pytest \
            --html=test-report.html \
            --self-contained-html \
            --alluredir=allure-results \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure \
            --output=playwright-artifacts

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && \
             [ -n "$(find allure-results -type f -print -quit)" ]; then
            allure generate allure-results \
              --clean -o allure-report
          else
            echo "No Allure results found."
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            test-report.html
            allure-results/
            allure-report/
            playwright-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1