[pytest]
; === Discovery ===
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; === Playwright ===
addopts =
    --slowmo=200
    --browser=chromium
    --html=reports/test-report.html
    --self-contained-html
    --alluredir=allure-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=playwright-artifacts

; === Logging ===
log_cli = true
log_cli_level = INFO