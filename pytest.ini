[pytest]
; === Discovery ===
testpaths = testpaths
pythonpath = .
python_files = test_*.pytest
python_classes = Test*
python_functions = test_*

; === Playwright ===
addopts =
    --headed
    --slowmo=200
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results

; === Logging ===
log_cli = true
log_cli_level = INFO

